name: Build and Deploy Static SEO Hub

on:
  push:
    branches: ["main"]
  schedule:
    # 매월 1일 자동 검증 및 재빌드
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run calculator unit tests
        run: npm test

      - name: Build static pSEO pages and sitemap
        run: npm run build

      - name: Verify SEO metadata and internal links
        run: npm run verify

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify IndexNow (Bing · Naver · AI Search)
        run: node scripts/ping-indexnow.js
        continue-on-error: true
