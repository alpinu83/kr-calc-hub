name: Monitor Korean Tax & Labor Law Updates

on:
  schedule:
    # 매월 2일 법제처 Open API로 핵심 법령 개정 여부 점검
    - cron: "0 1 2 * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check-laws:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Korean Law Open API
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
        run: node scripts/check-law-updates.js

      - name: Open issue when statute update detected
        if: hashFiles('law-diff.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("law-diff.md", "utf8");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[법령 개정 감지] 셈노트 세율·요율 점검 필요 (${new Date().toISOString().slice(0, 10)})`,
              body
            });

      - name: Save updated law versions baseline
        if: hashFiles('law-diff.md') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/law-versions.json
          git diff --cached --quiet || (git commit -m "chore: update tracked Korean law versions baseline" && git push)
